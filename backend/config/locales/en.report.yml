# commissioning-report 8.2 (D-R9/D14) — ALL fixed text of the Commissioning
# Protocol, resolved on the SERVER and delivered ready in the payload (the
# frontend has no copy of these strings). Versioned `v1`: changing the text of a
# signed document is a MATERIAL change — the new key would coexist with the old,
# not overwrite it. A sweep (8.2) fails CI if a key is missing or if a pt-BR
# literal appears inside features/report/.
en:
  report:
    v1:
      title: 'COMMISSIONING PROTOCOL'
      # Stamp
      stamp_label_done: 'COMPLETED'
      stamp_label_in_progress: 'IN PROGRESS'
      stamp_label_pending: 'PENDING'
      # Scope
      scope_all: 'Entire workspace'
      scope_project: 'Project'
      # Metadata
      meta_scope: 'Scope'
      meta_document_id: 'Document id'
      meta_issued_at: 'Issued on'
      meta_generated_by: 'Generated by'
      meta_structure: 'Structure'
      structure_format: '%{projects} project(s) · %{cells} cell(s) · %{robots} robot(s) · %{tasks} task(s)'
      # Sections
      section_distribution: 'Status distribution'
      section_body: 'Commissioning by project'
      section_conclusions: 'Conclusions'
      # Status (full-word labels of the distribution)
      status_done: 'Completed'
      status_in_progress: 'In Progress'
      status_pending: 'Pending'
      status_na: 'N/A'
      # Body
      weighted_progress_label: 'weighted progress'
      col_symbol: 'Symbol'
      col_description: 'Task'
      col_status: 'Status'
      col_percent: '%'
      col_assignees: 'Assignees'
      no_assignees: '—'
      history_transition: 'from %{from}% to %{to}%'
      history_continues: '— history continues on the next page —'
      # Conclusions
      concluded_by: 'Completed by'
      concluded_at: 'On'
      concluded_unknown: '—'
      # Signatures / footer
      signature_commissioner: 'Commissioner'
      signature_client: 'Client / Acceptance'
      signature_name: 'Name'
      signature_field: 'Signature'
      signature_date: 'Date'
      footer_generated_at: 'Document generated on'
      footer_traceability: 'Traceability document — the times reflect the moment each advance was recorded (recorded_at), not the time of synchronisation.'
      # Volume warnings (D-R8)
      warning_large_scope: 'Large scope: consider issuing the report per project for a leaner document.'
      warning_truncated: 'History truncated to the 10 most recent entries per task. The document is incomplete by volume — issue it per project for the full trail.'
      truncated_omitted: '(+%{count} earlier entries omitted)'
      error_scope_too_large: 'Scope too large: %{count} tasks exceed the cap of %{max}. Issue it per project (scope=project).'
